# Local Qdrant for the legal RAG:  docker compose up -d   (then: python cli.py index)
# The index lives in a named Docker volume, not in ./data: a bind mount made Docker create ./data as root on a
# fresh clone, and Python could then not write data/cache. Build or rebuild the index with `python cli.py index`.
services:
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333", "6334:6334"]
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_storage:
